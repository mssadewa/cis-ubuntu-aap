---
- name: Display CIS benchmark information
  ansible.builtin.debug:
    msg:
      - "Benchmark: {{ cis_benchmark_name }}"
      - "Version: {{ cis_benchmark_version }}"
      - "Ubuntu Release: {{ cis_benchmark_release }}"
      - "Execution Scope: {{ cis_run_scope }}"
      - "Remediation Enabled: {{ cis_remediate | bool }}"

- name: Validate CIS execution request
  ansible.builtin.include_tasks: validate.yml

- name: Select CIS controls dynamically
  ansible.builtin.include_tasks: select_controls.yml

- name: Initialize CIS result collection
  ansible.builtin.set_fact:
    cis_results: []

- name: Verify benchmark release data type
  ansible.builtin.debug:
    msg:
      - "Release: {{ cis_benchmark_release }}"
      - "Type: {{ cis_benchmark_release | type_debug }}"
      - "Is string: {{ cis_benchmark_release is string }}"

# - name: Execute selected CIS controls
#   ansible.builtin.include_tasks: execute_controls.yml

- name: Execute selected CIS controls
  ansible.builtin.include_tasks: execute_controls.yml
  when: not (cis_selection_only | bool)

- name: Display host CIS assessment summary
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "Controls assessed: {{ cis_results | length }}"
      - "PASS: {{ cis_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
      - "FAIL: {{ cis_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
      - "Remediation enabled: {{ cis_remediate | bool }}"
  when: not (cis_selection_only | bool)

- name: Build consolidated CIS results from all hosts
  ansible.builtin.set_fact:
    cis_all_results: >-
      {{
        ansible_play_hosts_all
        | map('extract', hostvars, 'cis_results')
        | flatten
      }}
  run_once: true
  when: not (cis_selection_only | bool)

- name: Display consolidated CIS assessment report
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "CONSOLIDATED CIS ASSESSMENT REPORT"
      - "========================================"
      - "Benchmark: {{ cis_benchmark_name }}"
      - "Version: {{ cis_benchmark_version }}"
      - "Ubuntu Release: {{ cis_benchmark_release }}"
      - "Hosts assessed: {{ cis_all_results | map(attribute='host') | unique | list | length }}"
      - "Total controls assessed: {{ cis_all_results | length }}"
      - "PASS: {{ cis_all_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
      - "FAIL: {{ cis_all_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
      - "========================================"
  run_once: true
  when: not (cis_selection_only | bool)

- name: Prepare CIS report summary
  ansible.builtin.set_fact:
    cis_report_summary:
      hosts_assessed: >-
        {{
          (
            cis_all_results
            | map(attribute='host')
            | unique
            | list
            | length
            | string
          ) | from_yaml
        }}
      controls_assessed: >-
        {{
          (
            cis_all_results
            | length
            | string
          ) | from_yaml
        }}
      pass: >-
        {{
          (
            cis_all_results
            | selectattr('status', 'equalto', 'PASS')
            | list
            | length
            | string
          ) | from_yaml
        }}
      fail: >-
        {{
          (
            cis_all_results
            | selectattr('status', 'equalto', 'FAIL')
            | list
            | length
            | string
          ) | from_yaml
        }}
  run_once: true
  when: not (cis_selection_only | bool)

- name: Debug CIS report summary data types
  ansible.builtin.debug:
    msg:
      - "hosts_assessed={{ cis_report_summary.hosts_assessed }} ({{ cis_report_summary.hosts_assessed | type_debug }})"
      - "controls_assessed={{ cis_report_summary.controls_assessed }} ({{ cis_report_summary.controls_assessed | type_debug }})"
      - "pass={{ cis_report_summary.pass }} ({{ cis_report_summary.pass | type_debug }})"
      - "fail={{ cis_report_summary.fail }} ({{ cis_report_summary.fail | type_debug }})"
  run_once: true
  when: not (cis_selection_only | bool)

- name: Test CIS benchmark release string conversion
  ansible.builtin.set_fact:
    cis_release_string_test: >-
      {{ cis_benchmark_release | string | to_json | from_json }}

- name: Display CIS benchmark release data types
  ansible.builtin.debug:
    msg:
      - "Original release: {{ cis_benchmark_release }}"
      - "Original type: {{ cis_benchmark_release | type_debug }}"
      - "Converted release: {{ cis_release_string_test }}"
      - "Converted type: {{ cis_release_string_test | type_debug }}"
      - "Is converted value a string: {{ cis_release_string_test is string }}"

- name: Publish consolidated CIS report to AWX artifacts
  ansible.builtin.set_stats:
    data:
      cis_report:
        benchmark:
          name: "{{ cis_benchmark_name }}"
          version: "{{ cis_benchmark_version }}"
          release: "{{ cis_benchmark_release }}"
        execution:
          scope: "{{ cis_run_scope }}"
          target_id: "{{ cis_target_id | default('') }}"
          remediation_enabled: "{{ cis_remediate | bool }}"
          exceptions: "{{ cis_exceptions }}"
        summary: "{{ cis_report_summary }}"
        results: "{{ cis_all_results }}"
    per_host: false
    aggregate: false
  run_once: true
  when: not (cis_selection_only | bool)
