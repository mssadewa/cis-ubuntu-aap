---
- name: Validate CIS execution scope
  ansible.builtin.assert:
    that:
      - cis_run_scope in ['item', 'group', 'all']
    fail_msg: >-
      Invalid cis_run_scope. Supported values are item, group, and all.

- name: Validate item selection input
  ansible.builtin.assert:
    that:
      - cis_items | length > 0
    fail_msg: "cis_items must contain at least one control ID when scope is item."
  when: cis_run_scope == 'item'

- name: Validate group selection input
  ansible.builtin.assert:
    that:
      - cis_target_id | length > 0
    fail_msg: "cis_target_id is required when scope is group."
  when: cis_run_scope == 'group'

- name: Validate remediation variable
  ansible.builtin.assert:
    that:
      - cis_remediate | bool in [true, false]
    fail_msg: "cis_remediate must be a boolean."
