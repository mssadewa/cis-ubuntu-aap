---
# Execution scope:
# item  = execute specific CIS control IDs
# group = execute all controls under a CIS heading ID
# all   = execute every control in the benchmark

cis_run_scope: "all"

# Used when cis_run_scope = item
cis_items: []

# Used when cis_run_scope = group
# Accepts any hierarchy level, e.g. 1, 1.1, 1.1.2, 1.1.2.1
cis_target_id: ""

# false = assessment only
# true  = assessment + remediation + reassessment
cis_remediate: false

# CIS control IDs to exclude from execution
cis_exceptions: []

# Internal execution variables
cis_selected_controls: []
cis_results: []

# Temporary testing mode:
# true  = select and display controls only
# false = execute selected control files
cis_selection_only: false
