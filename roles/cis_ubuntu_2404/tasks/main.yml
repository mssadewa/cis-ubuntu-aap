---
- name: Validate Ubuntu 24.04 target
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", ">=")
      - ansible_distribution_version is version("25.04", "<")
    fail_msg: >-
      This role is exclusively for Ubuntu 24.04.
      Detected {{ ansible_distribution }}
      {{ ansible_distribution_version }}.

- name: Load Ubuntu 24.04 CIS catalog
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/catalog.yml"
    name: cis_catalog

- name: Validate benchmark catalog version
  ansible.builtin.assert:
    that:
      - cis_catalog.benchmark.version == "2.0.0"
      - cis_catalog.benchmark.release == "24.04"
    fail_msg: "Invalid Ubuntu 24.04 CIS catalog."

- name: Initialize benchmark execution variables
  ansible.builtin.set_fact:
    cis_benchmark_name: "{{ cis_catalog.benchmark.name }}"
    cis_benchmark_version: "{{ cis_catalog.benchmark.version }}"
    cis_benchmark_release: "{{ cis_catalog.benchmark.release }}"
    cis_benchmark_role_path: "{{ role_path }}"

- name: Execute shared CIS engine
  ansible.builtin.include_role:
    name: cis_engine
