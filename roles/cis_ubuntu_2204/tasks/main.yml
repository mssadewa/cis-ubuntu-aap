---
- name: Validate Ubuntu 22.04 target
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("22.04", ">=")
      - ansible_distribution_version is version("23.04", "<")
    fail_msg: >-
      This role is exclusively for Ubuntu 22.04.
      Detected {{ ansible_distribution }}
      {{ ansible_distribution_version }}.

- name: Load Ubuntu 22.04 CIS catalog
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/catalog.yml"
    name: cis_catalog

- name: Debug CIS catalog release data type
  ansible.builtin.debug:
    msg:
      - "Catalog release: {{ cis_catalog.benchmark.release }}"
      - "Catalog release type: {{ cis_catalog.benchmark.release | type_debug }}"
      - "Is catalog release a string: {{ cis_catalog.benchmark.release is string }}"

- name: Validate benchmark catalog version
  ansible.builtin.assert:
    that:
      - cis_catalog.benchmark.version == "3.0.0"
      - cis_catalog.benchmark.release == "22.04"
    fail_msg: "Invalid Ubuntu 22.04 CIS catalog."

- name: Initialize benchmark execution variables
  ansible.builtin.set_fact:
    cis_benchmark_name: "{{ cis_catalog.benchmark.name }}"
    cis_benchmark_version: "{{ cis_catalog.benchmark.version }}"
    cis_benchmark_release: "22.04"
    cis_benchmark_role_path: "{{ role_path }}"

- name: Execute shared CIS engine
  ansible.builtin.include_role:
    name: cis_engine
